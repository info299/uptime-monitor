name: uptime

# Kontrola dostupnosti webů.
#
# POZOR na to, proč tenhle workflow vypadá takhle divně:
# GitHub plánované běhy odkládá a část jich zahazuje. Naměřeno 30.–31. 7. 2026:
# cron `*/5` se ve skutečnosti spustil jednou za 1–3,5 hodiny (9 běhů za 17 h
# místo ~200). Jedno měření na jeden běh proto nestačí.
#
# Řešení: jeden běh měří ve smyčce ~170 minut. Souběh hlídá concurrency —
# běžící úloha se NEruší (aby stihla uložit stav) a nový trigger čeká ve frontě,
# takže jakmile smyčka doběhne, hned ji vystřídá další. Runnery jsou ve veřejném
# repu zdarma, delší běh tedy nic nestojí.
#
# Zbylá slabina: když GitHub nespustí cron dýl než trvá smyčka, vznikne díra.
# Dashboard ji poctivě hlásí jako „chybí N měření".

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    env:
      LOOP_MINUTES: 170
      INTERVAL_SECONDS: 300
    steps:
      - uses: actions/checkout@v4

      # Stav (kdo byl naposled up/down) drží cache mezi běhy.
      - name: Načti předchozí stav
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: uptime-state-${{ github.run_id }}
          restore-keys: |
            uptime-state-

      - name: Měř ve smyčce
        env:
          SITES_JSON: ${{ secrets.SITES_JSON }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_FILE: .state/state.json
        run: |
          set -u
          END=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          FAILS=0
          N=0

          while [ "$(date +%s)" -lt "$END" ]; do
            N=$(( N + 1 ))
            echo "───── měření $N ($(date -u '+%H:%M:%S') UTC) ─────"

            if node check.mjs; then
              FAILS=0
            else
              FAILS=$(( FAILS + 1 ))
              echo "::warning::Měření selhalo ($FAILS. v řadě)"
              # Tři selhání po sobě = rozbitá konfigurace, ne výpadek webu.
              # Nemá smysl točit smyčku dál, ať je chyba vidět.
              if [ "$FAILS" -ge 3 ]; then
                echo "::error::Tři selhání po sobě — končím, aby to nebylo skryté."
                exit 1
              fi
            fi

            # Poslední kolo už nečeká, ať se stihne uložit stav.
            if [ "$(( $(date +%s) + INTERVAL_SECONDS ))" -ge "$END" ]; then break; fi
            sleep "$INTERVAL_SECONDS"
          done

          echo "Smyčka hotová: $N měření za ${LOOP_MINUTES} min."

      - name: Ulož stav
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: uptime-state-${{ github.run_id }}
